name: web-ui-ci

on:
  push:
    paths:
      - "apps/web/**"
      - "packages/api-client/**"
      - "packages/mcp-server/**"
      - ".github/workflows/web-ui-ci.yml"
      - "package.json"
      - "package-lock.json"
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/api-client/**"
      - "packages/mcp-server/**"
      - ".github/workflows/web-ui-ci.yml"
      - "package.json"
      - "package-lock.json"

jobs:
  web-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Audit JavaScript dependencies
        run: npm audit --audit-level=high
      - name: Build shared api client
        run: npm run api-client:build
      - name: Build MCP server
        # Nothing else compiles this package, so without a step here a broken
        # MCP server ships green. It imports the api-client's dist, so it has
        # to run after that build.
        run: npm run mcp-server:build
      - name: Lint web app
        run: npm run web:lint
      - name: Typecheck web app
        run: npm run web:typecheck
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      # The Playwright suite is route-level smoke tests: it auto-starts the
      # Next.js dev server and asserts static page content only. No backend
      # or database is required (and none is provided here).
      - name: Run web smoke tests (no backend)
        run: npm run web:test
