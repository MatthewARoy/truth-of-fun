# Weekly dependency updates, grouped so they arrive as a handful of reviewable
# PRs rather than dozens. CI (tests + pip-audit + npm audit + image builds)
# decides whether each is safe to merge.
version: 2
updates:
  - package-ecosystem: uv
    directory: "/"
    schedule: {interval: weekly}
    groups:
      python: {patterns: ["*"]}
  - package-ecosystem: npm
    directory: "/"
    schedule: {interval: weekly}
    groups:
      javascript: {patterns: ["*"]}
  - package-ecosystem: docker
    directories: ["/", "/apps/web", "/deploy"]
    schedule: {interval: weekly}
  - package-ecosystem: github-actions
    directory: "/"
    schedule: {interval: weekly}
